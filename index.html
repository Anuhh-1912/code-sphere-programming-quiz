<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillSprint Pro – Programming Quiz & Assessment Platform</title>
<style>
:root{--bg:#f6f8ff;--card:#fff;--tx:#1d2433;--mu:#6b7488;--bd:#e3e8f4;--b:#4285f4;--r:#ea4335;--y:#f4b400;--g:#34a853;--sh:0 4px 18px rgba(30,50,120,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#10131c;--card:#1a1f2d;--tx:#eef1f8;--mu:#9aa3b8;--bd:#2a3144;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd)}

main{max-width:1100px;margin:0 auto;padding:16px}
h2{margin:8px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grow{flex:1}.c{justify-content:center}.center{text-align:center}
.btn{border:0;background:var(--b);color:#fff;padding:12px 20px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}

.opt.ok{border-color:var(--g);background:rgba(52,168,83,.15)}.opt.no{border-color:var(--r);background:rgba(234,67,53,.15)}
.q{font-size:22px}.fb{background:rgba(66,133,244,.12);border-radius:14px;padding:14px;margin:12px 0}

.hero{min-height:88vh;display:grid;place-content:center;text-align:center;padding:24px;position:relative;overflow:hidden}

.mu{color:var(--mu)}.dots{display:flex;gap:4px;margin:10px 0}.dots i{flex:1;height:5px;border-radius:3px;background:var(--bd)}

.nv.on{background:var(--b);color:#fff}.nv:hover:not(.on){background:var(--bg)}

.formp{display:grid;place-items:center;padding:24px;background:var(--bg)}.fbox{width:100%;max-width:400px}

.divider{text-align:center;color:var(--mu);margin:12px 0;font-size:13px}
@media(max-width:820px){.auth{grid-template-columns:1fr}.brandp{padding:28px}.snip{display:none}
#side{position:fixed;inset:auto 0 0 0;top:auto;width:auto;height:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:9;border-right:0;border-top:1px solid var(--bd)}
.nv{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;width:auto;min-width:68px;text-align:center}.sb-brand,.sb-user,#side .grow{display:none}
main{padding-bottom:96px}header .srch{max-width:none}}
@media print{body *{visibility:hidden}.certf,.certf *{visibility:visible}.certf{position:absolute;left:0;top:0;width:100%}}
.stage{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden;background:#0b1020}
.aur{position:absolute;inset:-25%;background:radial-gradient(40% 40% at 20% 30%,rgba(66,133,244,.6),transparent),radial-gradient(35% 35% at 80% 25%,rgba(234,67,53,.5),transparent),radial-gradient(40% 40% at 70% 80%,rgba(251,188,5,.45),transparent),radial-gradient(40% 40% at 25% 80%,rgba(52,168,83,.55),transparent);filter:blur(30px);animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gcard{position:relative;width:100%;max-width:450px;background:var(--card);color:var(--tx);border-radius:24px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.stp{display:flex;gap:6px;margin:14px 0 18px}.stp div{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.stp b{display:grid;place-items:center;width:28px;height:28px;margin:0 auto 4px;border-radius:50%;background:var(--bd);color:var(--mu);font-size:13px}
.stp .on b{background:var(--b);color:#fff}.stp .ok b{background:var(--g);color:#fff}.stp .on,.stp .ok{color:var(--tx)}
.er{color:var(--r);min-height:22px;font-size:14px;margin:4px 0}
.otp{letter-spacing:.5em;text-align:center;font-size:26px;font-weight:800}
.demo{background:#fff6d6;color:#6b4e00;border-radius:12px;padding:10px;text-align:center;margin:12px 0;font-size:14px}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.pick button{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font:inherit;cursor:pointer}
.pick button.on{border-color:var(--b);background:rgba(66,133,244,.15);font-weight:700}
.chk div{opacity:0;animation:pop .4s forwards;margin:8px 0;text-align:left}@keyframes pop{to{opacity:1}}
.bar i.fill{width:0;animation:fillw 2.2s linear forwards}@keyframes fillw{to{width:100%}}
/* ===== v4: stable UI + new landing page ===== */
html{overflow-y:scroll;scrollbar-gutter:stable}
.L{animation:none}.aur{animation:none}.topic:hover,.kpi:hover{transform:none}
.land .L{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
.land{min-height:100vh;background:radial-gradient(620px 420px at 6% 4%,rgba(66,133,244,.17),transparent 70%),radial-gradient(520px 380px at 96% 8%,rgba(234,67,53,.12),transparent 70%),radial-gradient(540px 400px at 92% 60%,rgba(52,168,83,.13),transparent 70%),radial-gradient(540px 400px at 4% 78%,rgba(251,188,5,.15),transparent 70%),var(--bg)}
.wx{max-width:1120px;margin:0 auto;padding:0 20px}
.ln{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--card);border-bottom:1px solid var(--bd)}
.ln .wx{display:flex;align-items:center;gap:16px;height:64px}.ln a{color:var(--mu);font-weight:600;cursor:pointer}.ln a:hover{color:var(--tx)}
.lh{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center;padding-top:56px;padding-bottom:40px}
.lh h1{font-size:clamp(34px,5vw,60px);line-height:1.12;font-weight:900;margin:14px 0}
.lead{font-size:18px;color:var(--mu);max-width:520px}
.stats{display:flex;gap:30px;flex-wrap:wrap;margin-top:30px}.stats b{display:block;font-size:28px}.stats span{color:var(--mu);font-size:14px}
.mkw{position:relative;padding:18px 0}
.mock{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:0 24px 60px rgba(30,50,120,.18);overflow:hidden}
.mk-bar{display:flex;gap:6px;align-items:center;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--bd)}.mk-bar i{width:10px;height:10px;border-radius:50%}.mk-bar span{margin-left:10px;font-size:12px;color:var(--mu)}
.mk-body{padding:16px}.mk-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mk-k{background:var(--bg);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mu)}.mk-k b{display:block;font-size:20px;color:var(--tx)}
.mk-q{margin:12px 0;padding:12px;border:1px solid var(--bd);border-radius:14px}.mk-q small{color:var(--mu)}
.mk-o{margin-top:6px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;font-size:14px}.mk-o.ok{border-color:var(--g);background:rgba(52,168,83,.15);font-weight:700}
.mk-bars{display:flex;gap:8px;align-items:flex-end;height:56px}.mk-bars i{flex:1;border-radius:6px 6px 0 0}
.fl{position:absolute;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 12px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.sec{padding:48px 0}.sec h2{text-align:center;font-size:clamp(26px,3.4vw,36px);margin:0 0 6px}.sec .sub{text-align:center;color:var(--mu);margin:0 0 28px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.fc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px}.fc p{color:var(--mu);margin:6px 0 0}
.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;margin-bottom:10px}

</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mem={};
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}};
const sv=(k,v)=>{mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const CATS={Python:['🐍','b'],Java:['☕','r'],SQL:['🗄️','y'],DSA:['🌳','g']},CK={P:'Python',J:'Java',S:'SQL',D:'DSA'};
const DIFFS=['Beginner','Intermediate','Advanced'];
const BANK=[
['P',0,'Which keyword defines a function?',['func','def','function','lambda'],1,'def starts a function definition.'],
['P',0,'What is len("abc")?',['2','3','4','Error'],1,'The string has three characters.'],
['P',0,'Which symbol starts a comment?',['//','#','/*','--'],1,'# starts a one-line comment.'],
['P',1,'Which type is immutable?',['list','dict','tuple','set'],2,'Tuples cannot change after creation.'],
['P',1,'list(range(2,8,2)) returns?',['[2, 4, 6]','[2, 4, 6, 8]','[2, 3, 4]','[4, 6, 8]'],0,'range stops before 8 and steps by 2.'],
['P',1,'The "is" operator compares…',['Values','Identity','Types','Lengths'],1,'"is" checks if both names point to the same object.'],
['P',2,'A decorator is used to…',['Compile code','Wrap a function to extend it','Declare a class','Import modules'],1,'It takes a function and returns a modified one.'],
['P',2,'The GIL allows…',['Many threads running bytecode','One thread running bytecode at a time','No threads','Only processes'],1,'CPython runs one thread of bytecode at a time.'],
['P',2,'The yield keyword creates a…',['List','Generator','Class','Thread'],1,'A function containing yield becomes a generator.'],
['J',0,'Which method is the entry point of a Java program?',['start()','run()','main()','init()'],2,'The JVM starts at public static void main.'],
['J',0,'Which is NOT a primitive type?',['int','boolean','String','char'],2,'String is a class, not a primitive.'],
['J',0,'Which keyword creates an object?',['make','new','create','alloc'],1,'new allocates and constructs an object.'],
['J',1,'Which keyword stops a class being inherited?',['static','final','private','abstract'],1,'A final class cannot be extended.'],
['J',1,'Which collection forbids duplicates?',['ArrayList','LinkedList','HashSet','Vector'],2,'Sets store unique elements only.'],
['J',1,'Which keyword inherits a class?',['implements','extends','inherits','super'],1,'extends creates a subclass.'],
['J',2,'Default value of an uninitialized object field?',['0','null','undefined','empty'],1,'Object reference fields default to null.'],
['J',2,'Which kind of interface enables lambdas?',['Serializable','Functional interface','Cloneable','Marker interface'],1,'Lambdas implement interfaces with one abstract method.'],
['J',2,'Which of these is thread-safe?',['ArrayList','HashMap','ConcurrentHashMap','LinkedList'],2,'ConcurrentHashMap is built for concurrent access.'],
['S',0,'Which clause filters rows?',['ORDER BY','GROUP BY','WHERE','LIMIT'],2,'WHERE filters rows before grouping.'],
['S',0,'Which command retrieves data?',['GET','SELECT','FETCH','READ'],1,'SELECT queries data from tables.'],
['S',0,'Which keyword removes duplicate rows?',['UNIQUE','DISTINCT','DIFFERENT','ONLY'],1,'SELECT DISTINCT returns unique rows.'],
['S',1,'Which JOIN keeps all rows of the left table?',['INNER JOIN','LEFT JOIN','CROSS JOIN','SELF JOIN'],1,'LEFT JOIN uses NULL where the right side has no match.'],
['S',1,'Which clause filters groups after aggregation?',['WHERE','HAVING','FILTER','ON'],1,'HAVING runs after GROUP BY.'],
['S',1,'Which function counts rows?',['SUM()','COUNT()','TOTAL()','ROWS()'],1,'COUNT() returns the number of rows.'],
['S',2,'Which window function gives unique sequential numbers?',['RANK()','DENSE_RANK()','ROW_NUMBER()','NTILE()'],2,'ROW_NUMBER numbers every row uniquely.'],
['S',2,'In ACID, what does "I" mean?',['Integrity','Isolation','Indexing','Identity'],1,'Isolation stops concurrent transactions interfering.'],
['S',2,'What speeds up lookups on a column?',['View','Index','Trigger','Cursor'],1,'An index avoids scanning the whole table.'],
['D',0,'Time complexity of binary search?',['O(n)','O(log n)','O(n log n)','O(1)'],1,'The search space halves every step.'],
['D',0,'Which data structure is LIFO?',['Queue','Stack','Heap','Graph'],1,'A stack is last in, first out.'],
['D',0,'Cost of reading an array element by index?',['O(n)','O(log n)','O(1)','O(n^2)'],2,'Indexing is constant time.'],
['D',1,'Shortest paths with non-negative weights?',['DFS','Dijkstra','Kruskal','Prim'],1,'Dijkstra is greedy with a priority queue.'],
['D',1,'Worst-case time of quicksort?',['O(n log n)','O(n)','O(n^2)','O(log n)'],2,'Poor pivots lead to O(n^2).'],
['D',1,'Which traversal uses a queue?',['DFS','BFS','Inorder','Preorder'],1,'Breadth-first search uses a queue.'],
['D',2,'Which technique solves overlapping subproblems?',['Greedy','Dynamic programming','Divide only','Brute force'],1,'DP caches subproblem results.'],
['D',2,'Time to build a binary heap from n items?',['O(n log n)','O(n)','O(log n)','O(n^2)'],1,'Bottom-up heapify is O(n).'],
['D',2,'Which method detects a cycle in a linked list?',['Binary search','Floyd tortoise and hare','Quicksort','Heapify'],1,'Two pointers at different speeds meet if a cycle exists.']
].map(([c,d,q,o,a,e],id)=>({c:CK[c],d,q,o,a,e,id}));
ld('custom',[]).forEach(x=>BANK.push({...x,id:BANK.length}));
const BADGES=[

/* ===== v3: multi-step login / register wizard ===== */
const A0=()=>({s:'email',email:'',name:'',pw:'',exists:false,rem:true,code:'',goal:'Placement',topic:'Python',lvl:0,wk:5});
let A=A0();
const STEPS=()=>A.exists?['Email','Password','Verify']:['Email','Account','Verify','Personalize'];
const stepIdx=()=>({email:0,login:1,reg:1,otp:2,prefs:3,done:4})[A.s];
const aErr=m=>{const e=$('#err');if(e)e.textContent=m};
const newCode=()=>String(Math.floor(100000+Math.random()*900000));
function aEmail(e){e.preventDefault();const em=e.target.email.value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(em))return aErr('Enter a valid email address.');A.email=em;A.exists=!!users[em];A.s=A.exists?'login':'reg';render()}
function aLogin(e){e.preventDefault();const f=e.target;if(users[A.email].pw!==hs(f.pw.value))return aErr('Incorrect password. Try again or reset it.');A.rem=f.rem.checked;A.code=newCode();A.s='otp';render()}
function aReg(e){e.preventDefault();const f=e.target,n=f.name.value.trim(),p=f.pw.value;A.name=n;
  if(n.length<2)return aErr('Please enter your full name.');if(p.length<6)return aErr('Password needs at least 6 characters.');if(p!==f.pw2.value)return aErr('Passwords do not match.');if(!f.tc.checked)return aErr('Please accept the Terms to continue.');
  A.pw=p;A.code=newCode();A.s='otp';render()}
function aResend(){A.code=newCode();render();toast('New code generated')}
function aOtp(e){e.preventDefault();if(e.target.otp.value.trim()!==A.code)return aErr('That code is incorrect. Check the demo code above.');if(A.exists)enter(A.email,A.rem);else{A.s='prefs';render()}}
function aBack(){A.s=A.s==='otp'?(A.exists?'login':'reg'):'email';render()}
function aSet(k,v){A[k]=v;render()}
function aFinish(){const u=newUser(A.name,A.email,hs(A.pw));u.goal=A.wk;u.profile={goal:A.goal,topic:A.topic,lvl:A.lvl};users[A.email]=u;save();cfg.d=A.lvl;A.s='done';render();
  setTimeout(()=>{if(route==='auth'&&A.s==='done')enter(A.email,true)},2400)}

function enterApp(){go(session&&users[session]?'home':'auth')}
function jump(id){const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth'})}
render();
